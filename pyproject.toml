[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "void-walker"
version = "0.1.0"
description = "A terminal-based space horror RPG with AI-driven game mastering"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Void Walker Team" }
]
keywords = ["game", "rpg", "horror", "terminal", "ai", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Role-Playing",
]

dependencies = [
    "google-generativeai>=0.8.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
]

[project.scripts]
void-walker = "void_walker.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["void_walker"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
