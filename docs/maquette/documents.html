<title>Documents Void Walker</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Comparateur #209 : un document du lore touché dans le dock, trois affichages. 390 px, Phosphore (12 §2), thème sombre seul, voulu. Textes d'exemple. */
:root {
  color-scheme: dark;
  --page: #050403;
  --fond: #0a0907;
  --surface: #14100a;
  --texte: #f4c27a;
  --accent: #ffb23f;
  --secondaire: #b08850;
  --bordure: #76603a;
  --separateur: #4a3a20;
  --alerte: #ff5a4a;
  --voile: rgba(10, 9, 7, 0.55);
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
}
html, body { background: var(--page); margin: 0; }
body { color: var(--texte); font-family: var(--mono); font-size: 15px; line-height: 1.5; }
*, *::before, *::after { box-sizing: border-box; }
.page { max-width: 440px; margin: 0 auto; padding-block: 16px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 12px; }
.chapeau { font-size: 13px; color: var(--secondaire); margin: 0; }
.chapeau b { color: var(--texte); font-weight: 600; }
.etiquette { font-size: 11px; color: var(--secondaire); text-transform: uppercase; letter-spacing: .06em; margin: 0 0 -6px; }
.onglets { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.onglet { font: inherit; font-size: 12px; letter-spacing: .04em; min-height: 44px; background: transparent; color: var(--texte); border: 1px solid var(--bordure); cursor: pointer; padding: 2px 4px; }
.onglet[aria-selected=true] { background: var(--texte); color: var(--fond); border-color: var(--texte); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Téléphone : en-tête, récit, dock, navigation (12 §3.1). */
.tel { width: 100%; max-width: 390px; height: 844px; margin: 0 auto; border: 1px solid var(--separateur); background: var(--fond); display: flex; flex-direction: column; position: relative; overflow: hidden; }
.tel::after { content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 20; background: repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px); }
.entete { flex: none; min-height: 56px; padding: 14px 16px 10px; border-bottom: 1px solid var(--separateur); }
.entete h1 { margin: 0; font-size: 17px; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: .06em; }
.recit { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 10px 16px; font-size: 17px; line-height: 1.6; }
.recit .cmd { font-size: 12px; color: var(--secondaire); text-transform: uppercase; letter-spacing: .04em; margin: 0 0 4px; }
.recit p { margin: 0 0 10px; }
.dock { flex: none; border-top: 1px dashed var(--separateur); padding: 6px 16px 10px; display: grid; gap: 6px; }
.titre-section { display: flex; align-items: center; gap: 8px; margin: 4px 0; font-size: 13px; font-weight: 400; text-transform: uppercase; color: var(--secondaire); }
.titre-section::before, .titre-section::after { content: ''; border-top: 1px solid currentColor; }
.titre-section::before { flex: 0 0 16px; }
.titre-section::after { flex: 0 1 96px; }
.puces { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.puce { border: 1px solid var(--bordure); padding: 8px 12px; font-size: 15px; line-height: 1.3; min-height: 46px; display: flex; align-items: center; }
.puce.ouverte { background: var(--texte); color: var(--fond); border-color: var(--texte); }
.autour { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.autour span { border: 1px solid var(--bordure); min-height: 44px; display: flex; align-items: center; padding: 0 12px; font-size: 14px; opacity: .7; }
.salle { display: grid; grid-template-columns: minmax(0, 1fr) 112px; gap: 6px; }
.aller { font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; min-height: 48px; padding: 6px 10px; background: var(--texte); color: var(--fond); display: flex; align-items: center; gap: 8px; }
.aller.ferme { background: transparent; color: var(--texte); border: 1px dashed var(--bordure); }
.porte { min-height: 48px; border: 1px solid var(--bordure); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
.temoin { display: inline-block; width: 8px; height: 8px; margin-right: 7px; border: 1px solid currentColor; }
.temoin.plein { background: var(--accent); border-color: var(--accent); }
.nav { flex: none; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 10px 16px 14px; border-top: 1px solid var(--separateur); position: relative; z-index: 12; background: var(--fond); }
.nav span { border: 1px solid var(--bordure); min-height: 44px; display: flex; align-items: center; justify-content: center; font-size: 12px; letter-spacing: .06em; }

/* Bulle d'une puce (12 §3.5) : voile, bordure ambre, halo couleur fond, losange vers la puce. */
.voile { position: absolute; inset: 0; z-index: 8; background: var(--voile); }
.bulle { position: absolute; z-index: 9; left: 16px; right: 16px; display: flex; flex-direction: column; border: 1px solid var(--accent); background: var(--surface); box-shadow: 0 0 0 4px var(--fond); }
.bulle::after { content: ''; position: absolute; width: 12px; height: 12px; background: var(--surface); transform: rotate(45deg); left: var(--fleche, 25%); bottom: -7px; border-right: 1px solid var(--accent); border-bottom: 1px solid var(--accent); }
.bulle-entete { flex: none; display: flex; align-items: flex-start; border-bottom: 1px solid var(--separateur); }
.bulle-titre { flex: 1 1 auto; min-width: 0; margin: 0; padding: 11px 0 11px 12px; font-size: 15px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--accent); }
.bulle-icone { flex: none; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--accent); }
.bulle-corps { min-height: 0; overflow-y: auto; padding: 8px 12px 12px; }
.fiche p { margin: 0 0 8px; font-size: 15px; line-height: 1.5; }

/* Variante B et C : le support se lit avant le texte. */
.support { margin: 2px 0 10px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--secondaire); }
.support span { font-weight: 400; text-transform: none; letter-spacing: normal; }
.doc { font-size: 15px; line-height: 1.55; }
.doc p { margin: 0 0 8px; }
.doc .lieu { color: var(--accent); text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 3px; }
.doc-note { font-style: italic; padding-left: 12px; border-left: 1px dashed var(--bordure); }
.doc-note .signe { text-align: right; font-style: normal; color: var(--secondaire); }
.doc-terminal { border: 1px solid var(--bordure); font-size: 13px; line-height: 1.45; }
.doc-terminal .barre { background: var(--texte); color: var(--fond); padding: 3px 8px; font-weight: 600; letter-spacing: .06em; font-size: 12px; }
.doc-terminal ol { list-style: none; margin: 0; padding: 6px 8px 8px; display: grid; gap: 6px; }
.doc-terminal li { display: grid; grid-template-columns: 5ch minmax(0, 1fr); gap: 10px; }
.doc-terminal time { color: var(--accent); font-variant-numeric: tabular-nums; }
.doc-terminal .curseur { color: var(--accent); }
.doc-voix .didascalie { color: var(--secondaire); font-size: 13px; }
.doc-inscription { padding: 14px 8px; text-align: center; font-size: 24px; font-weight: 600; line-height: 1.25; letter-spacing: .14em; color: var(--accent); text-transform: uppercase; transform: rotate(-1.5deg); }
.doc-affiche { border: 3px double var(--bordure); padding: 10px 12px; }
.doc-affiche .titre { margin: 0 0 8px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.doc-affiche .pied { margin: 10px 0 0; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--secondaire); }

/* Variante C : page de lecture au-dessus de la navigation. */
.lecture { position: absolute; z-index: 9; left: 0; right: 0; top: 0; bottom: 69px; background: var(--fond); display: flex; flex-direction: column; border-bottom: 1px solid var(--accent); }
.lecture .haut { flex: none; padding: 14px 16px 10px; border-bottom: 1px solid var(--separateur); }
.lecture .haut p { margin: 0; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--secondaire); }
.lecture .haut h2 { margin: 2px 0 0; font-size: 17px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.lecture .corps { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 16px; }
.lecture .doc { font-size: 17px; line-height: 1.6; }
.lecture .doc-terminal { font-size: 15px; }
.lecture .doc-inscription { font-size: 30px; padding: 40px 8px; }
.lecture .bas { flex: none; padding: 8px 16px 12px; }
.lecture .bas span { display: flex; align-items: center; justify-content: center; min-height: 50px; border: 1px solid var(--accent); background: var(--accent); color: var(--fond); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }

.verdict { font-size: 13px; color: var(--secondaire); border-left: 2px solid var(--bordure); padding-left: 10px; margin: 0; }
.verdict b { color: var(--texte); font-weight: 600; }
@media (prefers-reduced-motion: reduce) { .doc-inscription { transform: none; } }
</style>

<div class="page">
  <p class="chapeau">Issue #209. On touche un document dans le dock : <b>comment s'affiche-t-il ?</b> Lire ne coûte aucune action dans les trois cas. Textes d'exemple écrits pour la maquette ; le nom souligné dans l'indice de clé est rempli avec la vraie pièce de la station.</p>

  <p class="etiquette">Support</p>
  <div class="onglets" role="tablist" id="supports" aria-label="Support du document"></div>

  <p class="etiquette">Affichage</p>
  <div class="onglets" role="tablist" id="variantes" aria-label="Affichage">
    <button class="onglet" role="tab" type="button" data-v="A" aria-selected="false">A · fiche actuelle</button>
    <button class="onglet" role="tab" type="button" data-v="B" aria-selected="true">B · fiche document</button>
    <button class="onglet" role="tab" type="button" data-v="C" aria-selected="false">C · page de lecture</button>
  </div>

  <div class="tel" id="tel"></div>
  <p class="verdict" id="verdict"></p>
</div>

<script>
(() => {
  // Chaque document : la pièce où il est, ce qu'on y lit en arrivant, les puces, et le document sous ses deux formes.
  const DOCS = {
    note: {
      onglet: 'Note', piece: 'Couchettes', cmd: 'Aller vers · couchettes',
      recit: ['Vous passez par la porte. Vous voici dans les couchettes. Vous n’étiez encore jamais venu ici.', 'Six couchettes superposées, des rideaux tirés à la hâte. Sur un oreiller, le creux d’une tête, encore marqué.'],
      puce: 'Note scotchée', autre: 'Trousse de soin',
      salles: [['Couloir B', true]],
      support: 'Note manuscrite', ou: 'scotchée au montant d’une couchette',
      plat: 'Une note manuscrite est scotchée au montant d’une couchette : « Rémi, arrête de cogner sur la cloison du hangar six pour faire peur aux nouveaux. Ce n’était déjà pas drôle la première fois. Cette nuit, quelque chose a cogné en retour. Inès »',
      doc: () => `<div class="doc doc-note"><p>Rémi,</p><p>arrête de cogner sur la cloison du hangar six pour faire peur aux nouveaux. Ce n’était déjà pas drôle la première fois.</p><p>Cette nuit, quelque chose a cogné en retour.</p><p class="signe">Inès</p></div>`,
    },
    terminal: {
      onglet: 'Terminal', piece: 'Bureau du fret', cmd: 'Aller vers · bureau du fret',
      recit: ['Vous passez par la porte. Vous voici dans le bureau du fret. Vous n’étiez encore jamais venu ici.', 'Un bureau vitré qui donne sur la plateforme. Des bordereaux jonchent le sol ; une chaise a roulé contre la vitre.'],
      puce: 'Terminal de quart', autre: 'Burette d’huile',
      salles: [['Plateforme de fret', true], ['Couloir A', false]],
      support: 'Journal de terminal', ou: 'resté allumé sur le bureau',
      plat: 'Un terminal resté allumé affiche le journal de quart de la plateforme deux : « 02:14 Conteneur CT-4471 en attente de contrôle sanitaire. Manifeste incomplet, expéditeur illisible. 03:40 Sonde thermique du hangar 6 : +4 °C autour du conteneur. Signalé au contrôle. 04:05 Pas de réponse du contrôle. Conteneur laissé au hangar 6. 06:58 R. Varga absent à la relève. Badge jamais sorti. »',
      doc: () => `<div class="doc doc-terminal"><div class="barre">JOURNAL DE QUART · PLATEFORME 2</div><ol>
        <li><time>02:14</time><span>Conteneur CT-4471 en attente de contrôle sanitaire. Manifeste incomplet, expéditeur illisible.</span></li>
        <li><time>03:40</time><span>Sonde thermique du hangar 6 : +4 °C autour du conteneur. Signalé au contrôle.</span></li>
        <li><time>04:05</time><span>Pas de réponse du contrôle. Conteneur laissé au hangar 6.</span></li>
        <li><time>06:58</time><span>R. Varga absent à la relève. Badge jamais sorti.<span class="curseur"> ▮</span></span></li></ol></div>`,
    },
    voix: {
      onglet: 'Enregistreur', piece: 'Buanderie', cmd: 'Aller vers · buanderie',
      recit: ['Vous passez par la porte. Vous voici dans la buanderie. Vous n’étiez encore jamais venu ici.', 'Des tambours ouverts, du linge répandu jusqu’au seuil. Une odeur douceâtre flotte, que la ventilation ne chasse pas.'],
      puce: 'Enregistreur', autre: null,
      salles: [['Couloir B', true]],
      support: 'Message enregistré', ou: 'jamais envoyé',
      plat: 'Un petit enregistreur traîne sur une machine. Le dernier message n’a jamais été envoyé : « Lucie, c’est papa. Ils parlent d’une fuite, on est confinés, ne t’inquiète pas. Il ne faut pas faire de bruit, ici. Ça n’a pas d’yeux, tu comprends ? Ça écoute. Je vais attendre que ça passe, et je te… »',
      doc: () => `<div class="doc doc-voix"><p class="didascalie">[voix basse, très près du micro]</p><p>« Lucie, c’est papa. Ils parlent d’une fuite, on est confinés, ne t’inquiète pas. »</p><p class="didascalie">[un long silence]</p><p>« Il ne faut pas faire de bruit, ici. Ça n’a pas d’yeux, tu comprends ? Ça écoute. Je vais attendre que ça passe, et je te… »</p><p class="didascalie">[fin de l’enregistrement]</p></div>`,
    },
    inscription: {
      onglet: 'Inscription', piece: 'Couloir B', cmd: 'Aller vers · couloir B',
      recit: ['Vous passez par la porte. Vous voici dans le couloir B. Vous n’étiez encore jamais venu ici.', 'Un couloir étroit, aux néons qui clignotent. Au sol, des traînées sombres filent vers la soute.'],
      puce: 'Inscription', autre: null,
      salles: [['Buanderie', true], ['Couchettes', true], ['Soute', false]],
      support: 'Inscription', ou: 'grattée dans la peinture de la porte',
      plat: 'Quelqu’un a gratté des lettres hautes dans la peinture de la porte : PAS UN BRUIT. ELLE ENTEND TOUT.',
      doc: () => `<div class="doc doc-inscription">Pas un bruit.<br>Elle entend tout.</div>`,
    },
    affiche: {
      onglet: 'Affiche', piece: 'Plateforme', cmd: 'Aller vers · plateforme de fret',
      recit: ['Vous passez par la porte. Vous voici sur la plateforme de fret. Vous n’étiez encore jamais venu ici.', 'Une plateforme haute de plafond, des rails de levage figés au-dessus du vide. Les projecteurs de travail éclairent des palettes renversées.'],
      puce: 'Affiche', autre: 'Planche',
      salles: [['Bureau du fret', true], ['Couloir A', false]],
      support: 'Affiche de la compagnie', ou: 'à l’entrée de la plateforme',
      plat: 'Une affiche de la compagnie, à l’entrée de la plateforme : « Note de service no 12. Tout colis dont le manifeste est incomplet est signalé au bureau du fret avant déchargement. En cas de doute, n’ouvrez pas. Votre sécurité est notre priorité. La Direction du transit. »',
      doc: () => `<div class="doc doc-affiche"><p class="titre">Note de service n° 12</p><p>Tout colis dont le manifeste est incomplet est signalé au bureau du fret avant déchargement.</p><p>En cas de doute, n’ouvrez pas.</p><p>Votre sécurité est notre priorité.</p><p class="pied">La Direction du transit</p></div>`,
    },
    cle: {
      onglet: 'Indice de clé', piece: 'Salle d’outillage', cmd: 'Aller vers · salle d’outillage',
      recit: ['Vous passez par la porte. Vous voici dans la salle d’outillage. Vous n’étiez encore jamais venu ici.', 'Un établi couvert de limaille, un étau ouvert, des outils pendus à un panneau troué. Il manque quelques outils, à leur ombre peinte.'],
      puce: 'Note punaisée', autre: null,
      salles: [['Couloir A', true]],
      support: 'Note manuscrite', ou: 'punaisée au-dessus de l’établi',
      plat: 'Une note est punaisée au-dessus de l’établi : « Planche du chantier rangée dans la consigne B, derrière les fûts. La reprendre sans prévenir, c’est la corvée de sas pendant un mois. Malik »',
      doc: () => `<div class="doc doc-note"><p>Planche du chantier rangée dans la <span class="lieu">consigne B</span>, derrière les fûts.</p><p>La reprendre sans prévenir, c’est la corvée de sas pendant un mois.</p><p class="signe">Malik</p></div>`,
    },
  };

  const VERDICTS = {
    A: '<b>A · fiche actuelle</b> : ce qui existe aujourd’hui, sans rien changer. Le document est fondu dans une seule phrase : pas de retour à la ligne, les heures d’un journal forment un bloc. On ne reconnaît pas le support d’un coup d’œil.',
    B: '<b>B · fiche document</b> : le même geste que pour tout objet, la bulle s’ouvre sur la puce. Le support est annoncé en haut et a sa propre typographie : on reconnaît un journal, une note ou une inscription avant de lire. Retours à la ligne et heures permis. <b>Ma recommandation.</b>',
    C: '<b>C · page de lecture</b> : une page à part, plus grande et plus immersive. Il faut un toucher de plus pour revenir, et l’écran de jeu disparaît pendant la lecture : on perd de vue les portes et les repères de danger.',
  };

  let s = 'note', v = 'B';
  const esc = (t) => t.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);

  function dock(d) {
    const puces = [`<span class="puce ouverte" id="puce-doc">▸ ${d.puce}</span>`];
    if (d.autre) puces.push(`<span class="puce">▸ ${d.autre}</span>`);
    const salles = d.salles.map(([nom, ouverte]) => `<div class="salle"><span class="aller${ouverte ? '' : ' ferme'}">→ ${nom}</span><span class="porte"><span class="temoin${ouverte ? ' plein' : ''}"></span>${ouverte ? 'Ouverte' : 'Fermée'}</span></div>`).join('');
    return `<div class="dock"><h2 class="titre-section">Dans la pièce</h2><div class="puces">${puces.join('')}</div>
      <div class="autour"><span>▸ Regarder</span><span>▸ Attendre</span></div>
      <h2 class="titre-section">Se déplacer vers</h2>${salles}</div>`;
  }

  function bulle(d) {
    const corps = v === 'A'
      ? `<div class="fiche"><p>${esc(d.plat)}</p></div>`
      : `<p class="support">${d.support} <span>· ${d.ou}</span></p>${d.doc()}`;
    return `<div class="voile"></div><div class="bulle" id="bulle"><div class="bulle-entete"><p class="bulle-titre">${d.puce}</p><span class="bulle-icone" aria-hidden="true">✕</span></div><div class="bulle-corps">${corps}</div></div>`;
  }

  function lecture(d) {
    return `<div class="lecture"><div class="haut"><p>${d.support} · ${d.ou}</p><h2>${d.puce}</h2></div><div class="corps">${d.doc()}</div><div class="bas"><span>Revenir à la pièce</span></div></div>`;
  }

  // Bulle posée au-dessus de la puce du document, losange pointé vers elle (placerBulle, app/ecran.ts).
  function placer() {
    const tel = document.getElementById('tel');
    const b = document.getElementById('bulle');
    const p = document.getElementById('puce-doc');
    if (!b || !p) return;
    const rt = tel.getBoundingClientRect(), rp = p.getBoundingClientRect();
    const bas = rt.bottom - rp.top + 12;
    b.style.bottom = `${bas}px`;
    b.style.maxHeight = `${rt.height - bas - 66}px`;
    b.style.setProperty('--fleche', `${rp.left - rt.left - 16 + rp.width / 2 - 6}px`);
  }

  function rendre() {
    const d = DOCS[s];
    document.getElementById('tel').innerHTML = `<header class="entete"><h1>${d.piece}</h1></header>
      <section class="recit"><p class="cmd">&gt; ${d.cmd}</p>${d.recit.map((t) => `<p>${t}</p>`).join('')}</section>
      ${dock(d)}
      <nav class="nav"><span>INVENTAIRE</span><span>CARTE</span><span>IA STATION</span></nav>
      ${v === 'C' ? lecture(d) : bulle(d)}`;
    document.getElementById('verdict').innerHTML = VERDICTS[v];
    document.querySelectorAll('[data-s]').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.s === s)));
    document.querySelectorAll('[data-v]').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.v === v)));
    placer();
  }

  const supports = document.getElementById('supports');
  supports.innerHTML = Object.entries(DOCS).map(([id, d]) => `<button class="onglet" role="tab" type="button" data-s="${id}" aria-selected="false">${d.onglet}</button>`).join('');
  supports.querySelectorAll('[data-s]').forEach((b) => b.addEventListener('click', () => { s = b.dataset.s; rendre(); }));
  document.querySelectorAll('[data-v]').forEach((b) => b.addEventListener('click', () => { v = b.dataset.v; rendre(); }));
  window.addEventListener('resize', placer);
  rendre();
  if (document.fonts) document.fonts.ready.then(placer);
})();
</script>
