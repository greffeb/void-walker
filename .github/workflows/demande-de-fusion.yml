name: Demande de fusion

# Sur chaque PR (AP-10) : vérification complète, captures sur téléphone simulé, version de test dans /pr-<numéro>/.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verification:
    name: Vérification complète
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify

  captures:
    name: Captures sur téléphone simulé
    needs: verification
    runs-on: ubuntu-latest
    env:
      PR_NUMERO: ${{ github.event.pull_request.number }}
      BASE_PATH: /${{ github.event.repository.name }}/pr-${{ github.event.pull_request.number }}/
      VERSION_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-${{ github.event.pull_request.number }}/
      CAPTURES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-${{ github.event.pull_request.number }}/captures/
      COMMIT: ${{ github.event.pull_request.head.sha }}
      PR_BODY: ${{ github.event.pull_request.body }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run captures
      - name: Joindre les captures et la version de test
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: version-de-test
          path: |
            dist/
            captures/
          if-no-files-found: ignore

  publication:
    name: Publication de la version de test
    needs: captures
    # Publie aussi quand les captures échouent, pour que l'échec soit visible dans la PR ; la PR reste en rouge.
    # Seules les branches de ce dépôt publient : une PR venue d'un fork n'a pas les droits d'écriture.
    if: ${{ !cancelled() && needs.captures.result != 'skipped' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      PR_NUMERO: ${{ github.event.pull_request.number }}
      COMMIT: ${{ github.event.pull_request.head.sha }}
      VERSION_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-${{ github.event.pull_request.number }}/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: version-de-test
          path: artefact
      - name: Publier dans /pr-${{ github.event.pull_request.number }}/
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "${COMMIT}" > artefact/dist/version.txt
          bash .github/scripts/publier-pages.sh "pr-${PR_NUMERO}" artefact/dist artefact/captures
      - name: Attendre que la version de test soit en ligne
        run: bash .github/scripts/attendre-pages.sh "${VERSION_URL}version.txt" "${COMMIT}"
      - name: Poster le lien et les captures dans la PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/commenter-pr.sh "${PR_NUMERO}" artefact/captures/commentaire.md
