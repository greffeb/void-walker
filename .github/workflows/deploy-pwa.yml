name: Deploy PWA to GitHub Pages

on:
  push:
    branches:
      - '**' # Keep branch-preview behavior for Claude Code branches
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Optimized for solo dev:
# If you push a fix while a build is already running,
# it cancels the old one and starts the new one immediately.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Quality checks
        run: |
          npm run typecheck
          npm run lint

      - name: Build PWA
        run: npm run build
        env:
          VITE_BASE_URL: /${{ github.event.repository.name }}/

      - name: Inject Build ID metadata
        run: |
          BUILD_ID="${{ github.run_id }}-${{ github.run_number }}"
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "Injecting Build ID: $BUILD_ID at $BUILD_TIME"
          sed -i "s|</head>|<meta name=\"build-id\" content=\"$BUILD_ID\" /><meta name=\"build-time\" content=\"$BUILD_TIME\" /></head>|" dist/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Output deployment URL
        run: echo "Deployed to ${{ steps.deployment.outputs.page_url }}"
