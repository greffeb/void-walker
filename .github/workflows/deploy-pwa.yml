name: Deploy PWA to GitHub Pages

on:
  push:
    branches:
      - '**' # This captures EVERY branch created by Claude Code
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Optimized for solo dev: 
# If you push a fix while a build is already running, 
# it cancels the old one and starts the new one immediately.
concurrency:
  group: "pages"
  cancel-in-progress: true 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pwa/package-lock.json

      - name: Install dependencies
        working-directory: ./pwa
        run: npm ci

      - name: Build PWA
        working-directory: ./pwa
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pwa/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Output deployment URL
        run: echo "Deployed to ${{ steps.deployment.outputs.page_url }}"
