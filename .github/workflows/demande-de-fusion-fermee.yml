name: Demande de fusion fermée

# À la fusion ou à la fermeture d'une PR, sa version de test est supprimée (D-131, AP-05).

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

# Même groupe que la publication de la PR : une publication en cours est annulée avant le retrait.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  retrait:
    name: Retrait de la version de test
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Retirer /pr-${{ github.event.pull_request.number }}/
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/retirer-pages.sh "pr-${{ github.event.pull_request.number }}"
