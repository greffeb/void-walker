name: Branche principale

# Sur la branche principale (AP-10) : vérification complète puis publication du jeu à la racine de GitHub Pages.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: principale
  cancel-in-progress: false

jobs:
  verification:
    name: Vérification complète
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify

  publication:
    name: Publication à la racine
    needs: verification
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Historique complet : le numéro de construction compte les commits (D-227).
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publier à la racine (les versions de test /pr-*/ sont conservées)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "${GITHUB_SHA}" > dist/version.txt
          bash .github/scripts/publier-pages.sh "" dist
      - name: Vérifier que la version principale est en ligne
        run: bash .github/scripts/attendre-pages.sh "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/version.txt" "${GITHUB_SHA}"
